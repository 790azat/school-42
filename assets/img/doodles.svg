<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" fill="none" stroke="#2b3445" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- pencil -->
  <g transform="translate(40 40) rotate(-35)">
    <rect x="0" y="0" width="70" height="14" rx="2" fill="#ffd166"/>
    <path d="M70 0 L88 7 L70 14 Z" fill="#f6e7c8"/>
    <path d="M82 4.7 L88 7 L82 9.3" fill="#2b3445"/>
    <rect x="-10" y="0" width="10" height="14" rx="3" fill="#ff8fab"/>
    <path d="M10 7 H60"/>
  </g>
  <!-- triangle ruler -->
  <g transform="translate(190 30)">
    <path d="M0 60 L60 0 L60 60 Z" fill="#bde0fe"/>
    <path d="M40 60 L60 40 L60 60 Z"/>
    <path d="M10 60 v-6 M20 60 v-8 M30 60 v-6 M60 10 h-6 M60 20 h-8 M60 30 h-6"/>
  </g>
  <!-- notebook -->
  <g transform="translate(330 24) rotate(8)">
    <rect x="0" y="0" width="54" height="68" rx="4" fill="#fff"/>
    <path d="M10 -4 v10 M22 -4 v10 M34 -4 v10 M46 -4 v10"/>
    <path d="M10 22 h34 M10 32 h34 M10 42 h28 M10 52 h20"/>
  </g>
  <!-- paper plane -->
  <g transform="translate(470 40)">
