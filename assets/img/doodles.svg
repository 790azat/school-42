    <path d="M-40 60 q20 -10 30 -24" stroke-dasharray="4 7"/>
  </g>
  <!-- globe -->
  <g transform="translate(580 150)">
    <circle cx="0" cy="0" r="24" fill="#a0e7c7"/>
    <path d="M-24 0 h48 M0 -24 q-14 24 0 48 M0 -24 q14 24 0 48"/>
    <path d="M-30 -10 a32 32 0 0 0 22 40"/>
    <path d="M0 24 v10 M-12 36 h24"/>
  </g>
  <!-- books stack -->
  <g transform="translate(40 190)">
    <rect x="0" y="30" width="80" height="14" rx="3" fill="#ffadad"/>
    <rect x="8" y="16" width="70" height="14" rx="3" fill="#bde0fe"/>
    <rect x="-4" y="2" width="76" height="14" rx="3" fill="#ffd166"/>
    <path d="M12 9 h40 M20 23 h40 M10 37 h50"/>
  </g>
  <!-- backpack -->
  <g transform="translate(230 170)">
    <path d="M6 14 q0 -14 22 -14 q22 0 22 14 v46 q0 6 -6 6 h-32 q-6 0 -6 -6 Z" fill="#ffc6ff"/>
    <path d="M18 0 q0 -10 10 -10 q10 0 10 10"/>
    <rect x="14" y="34" width="28" height="20" rx="4" fill="#fff"/>
    <path d="M14 42 h28"/>
  </g>
  <!-- star -->
  <path transform="translate(400 190)" d="M0 -18 L5 -6 L18 -6 L8 2 L12 15 L0 7 L-12 15 L-8 2 L-18 -6 L-5 -6 Z" fill="#ffd166"/>
  <!-- A B C -->
  <g transform="translate(470 220)" stroke-width="2.4">
    <path d="M0 24 L9 0 L18 24 M4 14 h10"/>
    <path d="M28 0 v24 h8 q8 0 8 -6 q0 -6 -8 -6 h-8 M28 0 h7 q7 0 7 6 q0 6 -7 6"/>
    <path d="M70 4 q-4 -4 -9 -4 q-10 0 -10 12 q0 12 10 12 q5 0 9 -4"/>
  </g>
  <!-- ruler -->
  <g transform="translate(110 320) rotate(-8)">
    <rect x="0" y="0" width="120" height="22" rx="3" fill="#caffbf"/>
    <path d="M12 0 v8 M24 0 v12 M36 0 v8 M48 0 v12 M60 0 v8 M72 0 v12 M84 0 v8 M96 0 v12 M108 0 v8"/>
  </g>
  <!-- light bulb -->
  <g transform="translate(330 300)">
    <path d="M0 0 q-20 0 -20 20 q0 12 10 20 v8 h20 v-8 q10 -8 10 -20 q0 -20 -20 -20 Z" fill="#fff3b0"/>
    <path d="M-8 54 h16 M-26 -6 l-6 -6 M26 -6 l6 -6 M0 -10 v-8"/>
  </g>
  <!-- tic tac toe -->
  <g transform="translate(520 300)">
    <path d="M14 0 v44 M30 0 v44 M0 14 h44 M0 30 h44"/>
    <path d="M3 3 l8 8 M11 3 l-8 8 M33 33 l8 8 M41 33 l-8 8"/>
    <circle cx="22" cy="22" r="4"/>
  </g>
  <!-- bubbles & swirls -->
  <circle cx="150" cy="120" r="6"/>
  <circle cx="162" cy="134" r="3"/>
  <circle cx="440" cy="120" r="5"/>
  <circle cx="610" cy="60" r="4"/>
  <circle cx="20" cy="390" r="5"/>
  <circle cx="260" cy="400" r="4"/>
  <path d="M600 380 q10 -20 -6 -26 q-14 -4 -12 10" />
  <path d="M170 250 c10 -14 26 -14 30 0 s-20 14 -10 24" stroke-dasharray="3 6"/>
