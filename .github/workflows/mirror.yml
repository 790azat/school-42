name: Mirror external files
# Temporary helper: downloads the externally linked files and pushes them to a
# separate review branch (mirror-review). Nothing is deployed: only main deploys,
# and the files are reviewed before any of them is copied into the site.
on:
  push:
    branches: [claude/project-thread-g20ea7]
    paths: [tools/mirror/**, .github/workflows/mirror.yml]
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "gdown==5.2.0"
      - name: Start from the files already downloaded
        run: git clone -q --depth 1 -b mirror-review "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mirror-out || true
      - run: python tools/mirror/mirror.py tools/mirror/links.txt
      - run: du -sh mirror-out && find mirror-out -type f | wc -l
      - name: Push files to the review branch
        run: |
          find mirror-out -type f -size +90M -print -delete
          cd mirror-out
          [ -d .git ] || git init -q -b mirror-review
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A && (git commit -qm "Downloaded external files for review" || true)
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mirror-review
