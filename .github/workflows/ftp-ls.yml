name: FTP list (diagnostics)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [.github/workflows/ftp-ls.yml]

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List FTP folders
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          ls_dir() {
            echo "===== /$1"
            curl -sS --ssl-reqd --list-only --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/$1" || true
          }
          echo "PWD after login:"
          curl -sS --ssl-reqd --user "$FTP_USERNAME:$FTP_PASSWORD" -Q "PWD" "ftp://$FTP_SERVER/" -o /dev/null -v 2>&1 | grep -E '^< 257' || true
          ls_dir ""
          ls_dir "public_html/"
          ls_dir "www/"
          ls_dir "school-42.am/"
          ls_dir "css/"
